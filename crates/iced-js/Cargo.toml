[package]
name = "iced-js"
version = "0.1.0"
edition.workspace = true

[dependencies]
log = { version = "0.4" }
rquickjs = { version = "0.14.0", features = [
    "rust-alloc",
    "loader",
    "futures",
    "macro",
    "phf",
    "parallel",
] }
tokio = { workspace = true, features = ["macros", "fs", "sync", "time"] }
iced = { workspace = true, features = ["svg", "tokio"] }
reqwest = { workspace = true, optional = true }
rust-silos = { version = "0.3.2", optional = true }

[dev-dependencies]
futures = { version = "0.3" }
env_logger = "0.11"
tokio = { workspace = true, features = ["full"] }

[features]
default = ["fetch", "embed"]
fetch = ["dep:reqwest"]
embed = ["dep:rust-silos"]
