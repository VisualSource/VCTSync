[package]
name = "iced-js"
version = "0.1.0"
edition.workspace = true

[dependencies]
log = { version = "0.4" }
rquickjs = { version = "0.14.0", features = [
    "rust-alloc",
    "loader",
    "futures",
    "macro",
    "phf",
    "parallel",
] }
tokio = { workspace = true, features = ["macros", "fs", "sync", "time"] }
iced = { workspace = true, features = ["svg", "tokio"] }
once_cell = "1.21.4"

[dev-dependencies]
futures = { version = "0.3" }
tokio = { workspace = true, features = ["full"] }
