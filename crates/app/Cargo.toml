[package]
name = "app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vcs"
path = "src/main.rs"

[dependencies]
iced-xml = { path = "../iced-xml" }
anyhow = "1.0.104"
iced = { version = "0.14.0", features = ["svg", "tokio", "sipper"] }
reqwest = { version = "0.13.4", features = ["stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
