[package]
name = "app"
version = "0.1.0"
edition = { workspace = true }

[[bin]]
name = "vcs"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
iced-xml = { path = "../iced-xml" }
iced-query = { path = "../iced-query" }
iced = { workspace = true, features = ["svg", "tokio", "sipper"] }
reqwest = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
chrono-humanize = "0.2"
tokio = { version = "1.53", features = ["fs"] }

[features]
