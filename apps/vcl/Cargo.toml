[package]
name = "vcl"
version = "0.1.0"
edition = { workspace = true }

[[bin]]
name = "vcl"
path = "src/main.rs"

[dependencies]
iced-js = { workspace = true }
anyhow = { workspace = true }
bepinex-lib = { path = "../../crates/bepinex-lib" }
iced = { workspace = true, features = ["svg", "tokio", "sipper"] }
iced_aw = { version = "0.14.0", features = ["drop_down", "menu"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { workspace = true, features = ["fs"] }
log = { version = "0.4" }
env_logger = "0.11.11"
