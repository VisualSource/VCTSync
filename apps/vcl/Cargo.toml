[package]
name = "vcl"
version = "0.1.0"
edition = { workspace = true }

[[bin]]
name = "vcl"
path = "src/main.rs"

[dependencies]
reqwest = { workspace = true }
iced-js = { workspace = true, features = ["js-compression", "img-element"] }
anyhow = { workspace = true }
bepinex-lib = { path = "../../crates/bepinex-lib" }
iced = { workspace = true, features = ["svg", "tokio", "sipper"] }
iced_aw = { version = "0.14.0", features = ["drop_down", "menu"] }
tokio = { workspace = true, features = ["fs"] }
log = { version = "0.4" }
env_logger = "0.11.11"
rfd = "0.17.2"
nanoserde = "0.2.1"
dirs = "7.0.0"
