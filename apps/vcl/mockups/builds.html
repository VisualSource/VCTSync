<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VCL Versions Mockup</title>
<style>
/* Versions page (rail › Builds) inside a 480x800 window. Dark-only, same tokens as the other mockups.
   Builds are VoidCrewTerminus releases (GitHub) and dev builds (dev agent). Installing one puts it into
   the chosen profile, like any other mod. */
:root {
  color-scheme: dark;
  --bg: #202225;
  --surface: #2a2c30;
  --surface-2: #33363b;
  --line: #3b3e44;
  --fg: #e6e6e6;
  --muted: #9a9ea6;
  --primary: #5865f2;
  --primary-fg: #ffffff;
  --success: #12664f;
  --danger: #c3423f;
  --warn: #b8892c;
  --tag: #d9a441;
  --font: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: #141517; color: var(--fg); font-family: var(--font); font-size: 14px;
  padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; align-items: center;
}
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; color: var(--muted); font-size: 12px; max-width: 480px; width: 100%; }
.toolbar strong { color: var(--fg); font-size: 13px; }
.toolbar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

.window {
  width: 480px; max-width: 100%; height: 800px; max-height: calc(100vh - 110px); min-height: 520px; flex: none;
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  display: flex; overflow: hidden; position: relative;
}
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.sm { width: 15px; height: 15px; }
svg.xs { width: 12px; height: 12px; }

.rail { display: flex; flex-direction: column; gap: 4px; padding: 4px; border-right: 1px solid var(--line); }
.rail .spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--primary); color: var(--primary-fg); border: 0; border-radius: 2px;
  padding: 5px 10px; font: inherit; cursor: pointer; white-space: nowrap;
}
.btn:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .5; cursor: default; filter: none; }
.btn:focus-visible, .select:focus-visible, .seg button:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
.btn.ghost { background: transparent; color: var(--fg); }
.btn.ghost:hover { background: var(--surface-2); filter: none; }
.btn.secondary { background: var(--surface-2); color: var(--fg); }
.btn.success { background: var(--success); }
.btn.icon { padding: 6px; }
.btn.sm { padding: 3px 8px; font-size: 13px; }
.rail .btn { padding: 6px; }
.rail .btn.on { outline: 1px solid var(--muted); }
.select { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 2px; padding: 5px 8px; font: inherit; min-width: 0; }
hr { border: 0; border-top: 1px solid var(--line); margin: 0; width: 100%; }
.meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 6px; align-items: center; }
.fill { flex: 1; min-width: 0; }
code, .mono { font-family: var(--mono); font-size: 12px; }

.page { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.head { display: flex; align-items: center; gap: 6px; padding: 10px 16px 8px 12px; }
.head .title { flex: 1; font-weight: 600; font-size: 15px; }
.top { padding: 0 12px 10px; display: flex; flex-direction: column; gap: 8px; }
.target { display: flex; gap: 8px; align-items: center; }
.target .select { flex: 1; }

/* installed card */
.card { background: var(--surface); border-radius: 3px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.ver { display: inline-flex; align-items: center; gap: 6px; }
.ver b { font-size: 16px; font-weight: 600; font-family: var(--mono); }
.badge { width: 34px; height: 34px; border-radius: 4px; display: grid; place-items: center; flex: none; background: #3a7bc8; color: #fff; }
.badge.dev { background: #7a5bd1; }
.badge.none { background: var(--surface-2); color: var(--muted); }

.chip { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--surface-2); color: var(--muted); white-space: nowrap; display: inline-flex; gap: 3px; align-items: center; }
.chip.ok { background: var(--success); color: #fff; }
.chip.warn { background: var(--warn); color: #1a1a1a; }
.chip.branch { background: #3c3550; color: #c9b8ff; font-family: var(--mono); }

/* source switch */
.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 2px; gap: 2px; margin: 0 12px; }
.seg button { flex: 1; background: transparent; color: var(--fg); border: 0; border-radius: 2px; padding: 5px 8px; font: inherit; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
.seg button[aria-pressed=true] { background: var(--primary); color: var(--primary-fg); }
.seg .count { font-size: 11px; opacity: .8; }

.list { flex: 1; min-height: 0; overflow: auto; padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
.build { background: var(--surface); border-radius: 3px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.build.current { outline: 1px solid var(--success); }
.build .line { display: flex; gap: 8px; align-items: center; }
.build .name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.build .name .ver b { font-size: 14px; }
.progress { display: flex; flex-direction: column; gap: 3px; }
.progress .track { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress .bar { height: 100%; background: var(--primary); width: 0; transition: width .12s; }
.progress.err .bar { background: var(--danger); }
.status { padding: 6px 16px 6px 12px; border-top: 1px solid var(--line); }
.center { flex: 1; display: grid; place-items: center; text-align: center; padding: 24px; }
.center > div { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.note { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; color: var(--muted); }
.note.bad { color: #e88; }
.skel { height: 52px; flex: none; border-radius: 3px; background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } .progress .bar { transition: none; } }

[data-w]::before {
  content: attr(data-w); display: none; position: absolute; top: -7px; right: 4px; z-index: 5;
  font: 10px/1.3 var(--mono); color: #1a1a1a; background: var(--tag); padding: 0 4px; border-radius: 2px; pointer-events: none; white-space: nowrap;
}
.annotate [data-w] { outline: 1px dashed var(--tag); outline-offset: 2px; position: relative; }
.annotate [data-w]::before { display: block; }
</style>
</head>
<body>

<div class="toolbar">
  <strong>VCL · Versions mockup (480×800)</strong>
  <label><input type="checkbox" id="opt-annotate"> Widget names</label>
  <label>Installed
    <select class="select" id="opt-installed">
      <option value="old">v0.9.2</option>
      <option value="latest">v1.0.0 (latest)</option>
      <option value="dev">dev build</option>
      <option value="none">Nothing</option>
    </select></label>
  <label>Dev agent
    <select class="select" id="opt-agent">
      <option value="ok">Connected</option>
      <option value="unset">Not configured</option>
      <option value="offline">Unreachable</option>
    </select></label>
  <label><input type="checkbox" id="opt-fail"> Next install fails</label>
</div>

<div class="window" id="win">
  <nav class="rail">
    <button class="btn" aria-label="Profiles"><svg class="i"><use href="#i-library"/></svg></button>
    <button class="btn on" aria-label="Builds" aria-current="page"><svg class="i"><use href="#i-boxes"/></svg></button>
    <button class="btn" aria-label="Logs"><svg class="i"><use href="#i-scroll"/></svg></button>
    <div class="spacer"></div>
    <button class="btn" aria-label="Settings"><svg class="i"><use href="#i-settings"/></svg></button>
  </nav>

  <main class="page">
    <div class="head">
      <span class="title">Versions</span>
      <button class="btn ghost icon" id="refresh" aria-label="Refresh versions" title="Refresh versions"><svg class="i sm"><use href="#i-refresh"/></svg></button>
    </div>

    <div class="top">
      <div class="target">
        <span class="meta">Install to</span>
        <select class="select" id="profile" data-w="select (profiles, defaults to active)">
          <option>Modded Main (active)</option>
          <option>Testing</option>
        </select>
      </div>
      <div class="card" id="installed" data-w="view (installed in profile)"></div>
    </div>

    <div class="seg" role="group" aria-label="Source" data-w="row of button (segmented)">
      <button aria-pressed="true" data-src="remote"><svg class="i sm"><use href="#i-network"/></svg>Releases <span class="count" id="count-remote"></span></button>
      <button aria-pressed="false" data-src="local"><svg class="i sm"><use href="#i-flask"/></svg>Dev builds <span class="count" id="count-local"></span></button>
    </div>

    <div class="list" id="list" data-w="scroll › col of build row"></div>

    <div class="status meta row"><span class="fill" id="status-text"></span></div>
  </main>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></symbol>
    <symbol id="i-boxes" viewBox="0 0 24 24"><path d="M7 16.5 2 13.5v6l5 3 5-3v-6z"/><path d="m17 16.5-5-3v6l5 3 5-3v-6z"/><path d="M12 8 7 5v6l5 3 5-3V5z"/></symbol>
    <symbol id="i-scroll" viewBox="0 0 24 24"><path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
    <symbol id="i-network" viewBox="0 0 24 24"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></symbol>
    <symbol id="i-flask" viewBox="0 0 24 24"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
    <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="m2 2 20 20"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></symbol>
  </defs>
</svg>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mb = n => (n / 1048576).toFixed(1) + " MB";

// Stand-ins for GitHub releases (VisualSource/VoidCrewTerminus) and the dev agent's /versions.
const REMOTE = [
  { id: "r5", version: "v1.0.0", branch: "main", time: "2 days ago", size: 2_480_000, pre: false },
  { id: "r4", version: "v1.0.0-rc.2", branch: "main", time: "6 days ago", size: 2_470_000, pre: true },
  { id: "r3", version: "v0.9.2", branch: "main", time: "3 weeks ago", size: 2_310_000, pre: false },
  { id: "r2", version: "v0.9.1", branch: "main", time: "1 month ago", size: 2_300_000, pre: false },
  { id: "r1", version: "v0.9.0", branch: "main", time: "2 months ago", size: 2_250_000, pre: false },
];
const LOCAL = [
  { id: "l3", version: "1.0.1-dev.14", branch: "feat/terminal-ui", time: "12 minutes ago", size: 2_510_000 },
  { id: "l2", version: "1.0.1-dev.13", branch: "main", time: "3 hours ago", size: 2_500_000 },
  { id: "l1", version: "1.0.0-dev.9", branch: "fix/sync-drift", time: "yesterday", size: 2_490_000 },
];
const all = [...REMOTE.map(b => ({ ...b, src: "remote" })), ...LOCAL.map(b => ({ ...b, src: "local" }))];
const byId = Object.fromEntries(all.map(b => [b.id, b]));

let source = "remote";
let installed = "r3";          // id installed in the chosen profile
const jobs = new Map();        // id -> { pct, step, error }

function renderInstalled() {
  const cur = installed && byId[installed];
  const card = $("#installed");
  if (!cur) {
    card.innerHTML = `<div class="row"><div class="badge none"><svg class="i sm"><use href="#i-download"/></svg></div>
      <div class="fill"><div>Not installed in this profile</div><div class="meta">Pick a version below to install it.</div></div></div>`;
    return;
  }
  card.innerHTML = `
    <div class="row">
      <div class="badge ${cur.src === "local" ? "dev" : ""}"><svg class="i sm"><use href="#i-${cur.src === "local" ? "flask" : "network"}"/></svg></div>
      <div class="fill">
        <div class="ver"><b>${esc(cur.version)}</b>${cur.branch !== "main" ? `<span class="chip branch">${esc(cur.branch)}</span>` : ""}</div>
        <div class="meta">${cur.src === "local" ? "Dev build" : "Release"} · installed ${esc(cur.time)}</div>
      </div>
      <button class="btn ghost icon" id="uninstall" aria-label="Uninstall" title="Uninstall from this profile"><svg class="i sm"><use href="#i-trash"/></svg></button>
    </div>`;
}

function rowAction(b) {
  const job = jobs.get(b.id);
  if (job && !job.error) return `<button class="btn sm" disabled>Installing…</button>`;
  if (b.id === installed) return `<span class="chip ok"><svg class="i xs"><use href="#i-check"/></svg>Installed</span>
    <button class="btn ghost sm" data-install="${b.id}" title="Download and install again">Reinstall</button>`;
  const label = installed ? "Switch" : "Install";
  return `<button class="btn ${installed ? "secondary" : ""} sm" data-install="${b.id}"><svg class="i xs"><use href="#i-${installed ? "swap" : "download"}"/></svg>${label}</button>`;
}

function rowProgress(b) {
  const job = jobs.get(b.id);
  if (!job) return "";
  if (job.error) return `<div class="progress err"><div class="track"><div class="bar" style="width:100%"></div></div>
    <div class="row"><span class="note bad fill"><svg class="i sm"><use href="#i-alert"/></svg><span>${esc(job.error)}</span></span>
    <button class="btn ghost sm" data-install="${b.id}">Retry</button></div></div>`;
  return `<div class="progress" data-w="col(text, progress bar)"><span class="meta">${esc(job.step)}</span><div class="track"><div class="bar" style="width:${job.pct}%"></div></div></div>`;
}

function renderList() {
  const list = $("#list");
  $("#count-remote").textContent = REMOTE.length;
  const agent = $("#opt-agent").value;
  $("#count-local").textContent = agent === "ok" ? LOCAL.length : "";

  if (source === "local" && agent !== "ok") {
    list.innerHTML = agent === "unset"
      ? `<div class="center"><div><svg class="i" style="width:40px;height:40px;color:var(--muted)"><use href="#i-flask"/></svg>
          <span>Dev builds come from the dev agent.</span><span class="meta">Set its address and token in Settings.</span>
          <button class="btn secondary">Open Settings</button></div></div>`
      : `<div class="center"><div><svg class="i" style="width:40px;height:40px;color:var(--muted)"><use href="#i-wifi-off"/></svg>
          <span>Couldn't reach the dev agent at <code>192.168.1.94:9787</code>.</span>
          <button class="btn secondary" id="retry-agent"><svg class="i sm"><use href="#i-refresh"/></svg>Retry</button></div></div>`;
    $("#status-text").textContent = agent === "unset" ? "Dev agent not configured" : "Dev agent unreachable";
    return;
  }

  const items = source === "remote" ? REMOTE.map(b => byId[b.id]) : LOCAL.map(b => byId[b.id]);
  list.innerHTML = items.map((b, i) => `
    <div class="build ${b.id === installed ? "current" : ""}" ${i === 0 ? 'data-w="view › col(row, progress)"' : ""}>
      <div class="line">
        <div class="name">
          <div class="ver"><b class="mono">${esc(b.version)}</b>
            ${b.pre ? `<span class="chip warn">Pre-release</span>` : ""}
            ${b.branch !== "main" ? `<span class="chip branch">${esc(b.branch)}</span>` : ""}
            ${i === 0 && source === "remote" ? `<span class="chip">Latest</span>` : ""}</div>
          <span class="meta">${esc(b.time)} · ${mb(b.size)}</span>
        </div>
        ${rowAction(b)}
      </div>
      ${rowProgress(b)}
    </div>`).join("");
  $("#status-text").textContent = source === "remote"
    ? "github.com/VisualSource/VoidCrewTerminus · checked 1 min ago"
    : "Dev agent 192.168.1.94:9787 · checked just now";
}

function render() { renderInstalled(); renderList(); }

// One install at a time; mirrors install_build's (downloaded, total) progress + verify + extract.
function install(id) {
  if ([...jobs.values()].some(j => !j.error)) return;
  const b = byId[id];
  const fail = $("#opt-fail").checked;
  let done = 0;
  jobs.set(id, { pct: 0, step: "Starting download…" });
  render();
  const tick = () => {
    done = Math.min(b.size, done + b.size / 12);
    const pct = Math.round(done / b.size * 80);
    jobs.set(id, { pct, step: `Downloading ${mb(done)} of ${mb(b.size)}` });
    render();
    if (done < b.size) return setTimeout(tick, 90);
    jobs.set(id, { pct: 88, step: "Verifying digest…" });
    render();
    setTimeout(() => {
      if (fail) {
        $("#opt-fail").checked = false;
        jobs.set(id, { error: "Digest mismatch: the download doesn't match the release's sha256. Nothing was changed." });
        return render();
      }
      jobs.set(id, { pct: 95, step: "Extracting into Modded Main…" });
      render();
      setTimeout(() => { jobs.delete(id); installed = id; syncOpt(); render(); }, 400);
    }, 450);
  };
  setTimeout(tick, 200);
}

function syncOpt() {
  $("#opt-installed").value = !installed ? "none" : installed === "r5" ? "latest" : byId[installed].src === "local" ? "dev" : "old";
}

document.addEventListener("click", e => {
  const ins = e.target.closest("[data-install]");
  if (ins) return install(ins.dataset.install);
  if (e.target.closest("#uninstall")) { installed = null; syncOpt(); return render(); }
  if (e.target.closest("#retry-agent")) { $("#opt-agent").value = "ok"; return render(); }
});
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  source = b.dataset.src;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  renderList();
});
$("#refresh").onclick = () => {
  $("#list").innerHTML = Array(5).fill('<div class="skel"></div>').join("");
  $("#status-text").textContent = "Checking for versions…";
  setTimeout(renderList, 700);
};
$("#opt-installed").onchange = e => { installed = { old: "r3", latest: "r5", dev: "l2", none: null }[e.target.value]; render(); };
$("#opt-agent").onchange = renderList;
$("#opt-annotate").onchange = e => $("#win").classList.toggle("annotate", e.target.checked);

render();
</script>
</body>
</html>
