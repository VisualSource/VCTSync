[workspace]
resolver = "3"

members = [
    "crates/iced-xml",
    "crates/app",
    "crates/iced-query",
    "crates/launcher-lib", "crates/iced-js", "crates/iced-js-example-app",
]
default-members = ["crates/app"]

[workspace.dependencies]
anyhow = "1.0"
iced = "0.14"
reqwest = { version = "0.13", features = ["stream", "json"] }
tokio = "1.53"
[workspace.package]
edition = "2024"
