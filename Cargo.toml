[workspace]
resolver = "3"
members = ["crates/vct-core", "crates/vct-agent", "crates/vct-sync"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
vct-core = { path = "crates/vct-core" }

anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
reqwest = { version = "0.13.4", features = ["stream", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
